{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}
{% block tagline %}{{ title }}{% endblock %}

{% block content %}
    <div class="card">
        <h2>{{ hostname }}</h2>
        {% if packages %}
            <input type="text" class="search-box" data-rows=".package-row"
                   placeholder="Search packages...">
            <table>
                <tr><th>Package</th></tr>
                {% for package in packages %}
                <tr class="package-row"><td>{{ package }}</td></tr>
                {% endfor %}
            </table>
        {% else %}
            <div class="healthy-message">✓ No packages found.</div>
        {% endif %}
    </div>
{% endblock %}
